# ============================================================
# Nginx Internal - Routeur applicatif
# Rôle : routage vers frontend/backend, pas de SSL (trafic interne)
# ============================================================

upstream frontend_upstream {
    server frontend:80;
    # Load balancing possible : server frontend-2:80;
}

upstream backend_upstream {
    server backend:3000;
    # Load balancing possible : server backend-2:3000;
}

server {
    listen 80;
    server_name _;

    # --- Logs internes ---
    access_log /var/log/nginx/internal_access.log;
    error_log  /var/log/nginx/internal_error.log warn;

    # --- API Backend ---
    location /transport/api/ {
        proxy_pass         http://backend_upstream/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_x_real_ip;
        proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Request-ID      $http_x_request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering pour les réponses volumineuses (imports Excel)
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;

        client_max_body_size 50M;
    }

    # --- Frontend ---
    location / {
        proxy_pass       http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Cache des assets statiques
        proxy_cache_valid 200 1h;
    }

    # --- Health check (monitoring interne) ---
    location /nginx-health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
