# ============================================================
# Nginx Local - Développement uniquement
# Rôle : proxy HTTP simple, pas de SSL, pas de redirect
# ============================================================

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    access_log /var/log/nginx/local_access.log;
    error_log  /var/log/nginx/local_error.log warn;

    location /transport/api/ {
        proxy_pass         http://nginx-internal;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location / {
        proxy_pass         http://nginx-internal;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
